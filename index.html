<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>HTML</title>
</head>

<body>
  <p>Nothing to see here...</p>
  <form id="payment-form"></form>
  <!-- Project -->
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    mykey
    const mykey = 'pk_test_51P4nzZP4bdbKFa7kKx0OzeFwQThwfMcI07vFCBLnxXoMWsSSYAq4xanQrKcabEt4ZJcGTeWomOeGO4CUykxWHiW400cvwjpUYU'
    const stripe = Stripe(mykey);

    const elements = stripe.elements();
    const cardElement = elements.create('card');
    cardElement.mount('#card-element');

    const form = document.getElementById('payment-form');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const { error, paymentMethod } = await stripe.createPaymentMethod({
        type: 'card',
        card: cardElement,
      });

      if (error) {
        // Handle error (e.g., display error message to user)
      } else {
        // Send paymentMethod.id to your server to create a Payment Intent
        const response = await fetch('/create-payment-intent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentMethodId: paymentMethod.id }),
        });

        const data = await response.json();

        if (data.clientSecret) {
          const result = await stripe.confirmCardPayment(data.clientSecret);

          if (result.error) {
            // Handle error (e.g., display error message to user)
          } else {
            // Payment successful!
            // Redirect user to success page
          }
        }
      }
    });
  </script>

</body>

</html>
